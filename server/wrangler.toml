# Apex's AI door + open-beta inbox (worker.js). Deploy: see README.md.
# Secrets, set once, never in this file:
#   npx wrangler secret put AICREDITS_API_KEY     the provider key (same as .env)
#   npx wrangler secret put TESTER_TOKENS         optional: hand-made tokens from new_tester.py
name = "apex-ai-door"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# fill in the two ids printed by `npx wrangler kv namespace create TESTERS` / `... FEEDBACK`
[[kv_namespaces]]
binding = "TESTERS"
id = "27086be67189408facad5c745ea45d70"

[[kv_namespaces]]
binding = "FEEDBACK"
id = "48a36b9c905a456e874fe9e928a6949e"
